spring.application.name=innovacion
spring.config.import=optional:file:.env[.properties]
spring.profiles.default=local
server.port=8080

app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# Bootstrap del administrador inicial (garantiza el rol 'administrador' en usuario_roles).
# Cambiar la contrasena y/o desactivar (enabled=false) en produccion.
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap.admin.correo=${BOOTSTRAP_ADMIN_CORREO:admin@uam.edu.ni}
app.bootstrap.admin.contrasena=${BOOTSTRAP_ADMIN_CONTRASENA:Admin12345}
app.bootstrap.admin.nombre=${BOOTSTRAP_ADMIN_NOMBRE:Administrador del Sistema}
app.bootstrap.admin.documento=${BOOTSTRAP_ADMIN_DOCUMENTO:ADMIN-0001}
