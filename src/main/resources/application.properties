spring.application.name=innovacion
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/innovacion}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456789}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.security.jwt.secret=${JWT_SECRET:dev-secret-for-local-development-only-change-me-1234567890}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
