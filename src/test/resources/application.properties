spring.application.name=innovacion-test

spring.datasource.url=jdbc:h2:mem:innovacion_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.security.jwt.secret=test-secret-for-jwt-tests-only-change-me-1234567890
app.security.jwt.expiration-minutes=480
